# Пример для server { } test-домена. Применять только после этапа 0: сначала выяснить,
# есть ли перед Nginx ещё прокси (FASTPANEL/Apache) и что приходит в $remote_addr.
# Внутренние порты CRM (3001) и игры наружу не проксируются.

location = /game {
    return 301 /game/;
}

location /game/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Игра верит только X-Real-IP и только от 127.0.0.1. Значение перезаписывается, а не дополняется.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    client_max_body_size 16k;
    proxy_read_timeout 30s;
}
