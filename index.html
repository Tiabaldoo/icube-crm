<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>iCube CRM</title>
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <div id="app" style="visibility:hidden"></div>
  <script src="./src/frontend/crm-ui.js"></script>
  <script>
    document.querySelector('#app')?.replaceChildren();
    const originalEditLessonForm = window.editLessonForm;
    window.editLessonForm = function(id, role) {
      originalEditLessonForm(id, role);
      if (role === 'teacher') return;
      const state = window.icubeLegacy?.state;
      const lesson = state?.lessons?.find((item) => item.id === Number(id));
      const group = state?.groups?.find((item) => item.id === Number(lesson?.groupId));
      const siteSelect = document.querySelector('#le-site');
      if (!siteSelect || !group) return;
      [...siteSelect.options].find((option) => option.value && Number(option.value) === Number(group.siteId))?.remove();
      if (Number(lesson?.siteOverrideId) === Number(group.siteId)) siteSelect.value = '';
    };
  </script>
  <script type="module" src="./src/frontend/api-sync.mjs"></script>
  <script type="module" src="./src/frontend/enrollment-delete.mjs"></script>
  <script type="module" src="./src/frontend/direction-price-settings.mjs"></script>
</body>
</html>
