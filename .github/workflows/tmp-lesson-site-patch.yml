name: Temporary lesson site override patch

on:
  push:
    branches: ["feat/lesson-site-override"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lesson-site-override
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/tmp-lesson-site-patch.py
        continue-on-error: true
      - run: python3 .github/tmp-lesson-site-finish.py
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: git diff --check
      - name: Commit focused feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/lessons.mjs backend/src/deletion.mjs src/frontend/api-sync.mjs src/frontend/crm-ui.js database/migrations/010_lesson_site_override.sql tests/lesson-site-override.test.mjs
          git commit -m "Add per-lesson site overrides"
          git push origin HEAD:feat/lesson-site-override
