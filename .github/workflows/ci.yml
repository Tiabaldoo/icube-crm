name: CRM checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm ci --prefix game --ignore-scripts
      - run: npm --prefix game test

  # Игровой сервер с настоящей MySQL: временный контейнер только для этого прогона,
  # база icube_game_test. Никаких подключений к серверам и базам проекта.
  game-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: icube_game_test
          MYSQL_USER: icube_game_test_app
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      GAME_INTEGRATION: "1"
      GAME_DB_HOST: 127.0.0.1
      GAME_DB_PORT: "3306"
      GAME_DB_NAME: icube_game_test
      GAME_DB_USER: icube_game_test_app
      GAME_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix game --ignore-scripts
      - run: npm --prefix game run migrate
      - run: npm --prefix game run test:integration
